# Configuration for Character-level Tiny Shakespeare GPT Training
model:
  vocab_size: 65
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.2
  bias: false
  norm_type: "layernorm"
  activation: "gelu"
  use_rope: false
  tie_weights: true

training:
  batch_size: 64
  grad_accum_steps: 1
  learning_rate: 0.0003
  min_lr: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_iters: 200
  max_iters: 5000
  eval_interval: 500
  eval_iters: 200
  save_interval: 1000
  checkpoint_dir: "checkpoints/shakespeare"
  device: "auto"
  mixed_precision: "none"
  seed: 1337
  log_interval: 50

data:
  dataset_path: "input.txt"
  data_dir: "data"
  tokenizer_type: "char"
  block_size: 256
  train_split: 0.9
  use_memmap: false

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-gpt-prod"
version = "1.0.0"
description = "A production-grade, extensible GPT language model framework built from scratch in PyTorch"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Adil Shamim", email = "157037615+AdilShamim8@users.noreply.github.com" }
]
keywords = [
    "deep-learning",
    "gpt",
    "transformer",
    "language-model",
    "pytorch",
    "nlp",
    "llm",
    "generative-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]
full = [
    "tiktoken>=0.4.0",
    "safetensors>=0.3.1",
    "transformers>=4.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
gpt = "gpt.cli.main:main"
gpt-train = "train:main"
gpt-generate = "generate:main"
gpt-serve = "serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpt*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
